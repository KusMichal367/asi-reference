# Sprint 2 — szablon katalogu danych Kedro.
# TODO (zespół): zdefiniuj wejścia/wyjścia w formacie Kedro Data Catalog,
# np. raw_data, dane po przetworzeniu, model i metryki.
# Użyj nazw klas zakończonych na Dataset, zgodnie z wersją Kedro.



raw_data:
  type: pandas.CSVDataset
  filepath: "data/01_raw/iranian_churn/Customer Churn.csv"

prepared_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/prepared_data.csv
  save_args:
    index: false

trained_model:
  type: pickle.PickleDataset
  filepath: data/06_models/trained_model.pkl


dummy_model:
  type: pickle.PickleDataset
  filepath: data/06_models/dummy_model.pkl

metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/metrics.json
  save_args:
    indent: 2

autogluon_results:
  type: json.JSONDataset
  filepath: data/08_reporting/autogluon_results.json
  save_args:
    indent: 2

model_benchmark:
  type: json.JSONDataset
  filepath: data/08_reporting/model_benchmark.json
  save_args:
    indent: 2

selected_model:
  type: json.JSONDataset
  filepath: data/08_reporting/selected_model.json
  save_args:
    indent: 2

model_comparison:
  type: pandas.CSVDataset
  filepath: data/08_reporting/model_comparison.csv
  save_args:
    index: false
    lineterminator: "\n"  # bez tego na Windows powstaje \r\r\n
